<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{background:#1e1e1e;color:#eee;font:15px/1.5 Arial;margin:0;padding:18px;color-scheme:dark}h2{font-size:23px}.setting-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #444;padding:13px 0}.setting-item-control{display:flex;gap:8px}.setting-item-info{flex:1}.setting-item-description{font-size:13px;color:#aaa}.settings{max-width:860px;margin:auto}input,textarea,button,select{font:inherit;color:inherit;background:#333;border:1px solid #555;border-radius:5px;padding:7px}button{cursor:pointer}input[type=checkbox]{width:22px!important}/*STYLE*/</style><body><script>
window.onerror=m=>document.body.dataset.error=m;
HTMLElement.prototype.empty=function(){this.replaceChildren()};HTMLElement.prototype.addClass=function(c){this.classList.add(c)};HTMLElement.prototype.createEl=function(tag,o={}){const el=document.createElement(tag);el.textContent=o.text||'';if(o.cls)el.className=o.cls;this.append(el);return el;};
const assert=(v,m)=>{if(!v)throw Error(m)},xml=s=>s.replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
class Setting{constructor(parent){this.el=parent.createEl('div',{cls:'setting-item'});const info=this.el.createEl('div',{cls:'setting-item-info'});this.name=info.createEl('div');this.desc=info.createEl('div',{cls:'setting-item-description'});this.controlEl=this.el.createEl('div',{cls:'setting-item-control'});}setName(t){this.name.textContent=t;return this}setDesc(t){this.desc.textContent=t;return this}component(tag,fn,type){const e=this.controlEl.createEl(tag);if(type)e.type=type;const c={inputEl:e,setValue(v){if(type==='checkbox')e.checked=v;else e.value=v;return c},getValue(){return e.value},setButtonText(t){e.textContent=t;return c},addOptions(opts){for(const[v,t]of Object.entries(opts)){const o=e.createEl('option',{text:t});o.value=v;}return c},onChange(fn){e.addEventListener('change',()=>fn(type==='checkbox'?e.checked:e.value));return c},onClick(fn){e.addEventListener('click',fn);return c}};fn(c);return this}addButton(fn){return this.component('button',fn)}addDropdown(fn){return this.component('select',fn)}addText(fn){return this.component('input',fn)}addTextArea(fn){return this.component('textarea',fn)}addToggle(fn){return this.component('input',fn,'checkbox')}}
const notes=new Map(),events=new Map(),lists=new Map(),nativeCalls=[],tabs=[],commands=new Map(),notices=[];let serial=1,stored={namespace:'a'.repeat(32),enabled:true,devices:'mobile',server:'https://dav.example.test/',user:'test-user',password:'test-password',timezone:'Europe/Moscow',delaySeconds:0,pollSeconds:300,state:{}};
const add=(path,text)=>{const f={path,extension:'md',text,stat:{mtime:++serial,size:text.length}};notes.set(path,f);return f;};
const mainNote=add('daily.md','- [ ] #task/inbox Позвонить ⏰ 13:00 📅 2026-11-15\n- [ ] #category/work Встреча ⏰ 14:00 ⏱️ 2h 🛫 2026-11-13 📅 2026-11-15\n- [ ] #task/inbox Без времени 📅 2026-11-15\n- [ ] Просто чекбокс ⏰ 13:00 📅 2026-11-15');
const response=(url,props)=>'<d:response><d:href>'+xml(url)+'</d:href><d:propstat><d:prop>'+props+'</d:prop><d:status>HTTP/1.1 200 OK</d:status></d:propstat></d:response>';
const multi=rows=>'<d:multistatus xmlns:d="DAV:" xmlns:c="urn:ietf:params:xml:ns:caldav">'+rows+'</d:multistatus>';
const nativeRequest=async req=>{
 nativeCalls.push(req);assert(new URL(req.url).origin==='https://dav.example.test','credentials origin changed');const auth=req.headers.Authorization||req.headers.authorization;assert(auth==='Basic '+btoa('test-user:test-password'),'auth missing');const body=typeof req.body==='string'?req.body:req.body?new TextDecoder().decode(req.body):'';
 if(req.method==='PROPFIND'){
  if(req.url==='https://dav.example.test/')return{status:207,text:multi(response('/', '<c:calendar-home-set><d:href>/home/</d:href></c:calendar-home-set>'))};
  if(req.url==='https://dav.example.test/home/')return{status:207,text:multi([...lists].map(([url,l])=>response(url,'<d:displayname>'+xml(l.name)+'</d:displayname><d:resourcetype><c:calendar/></d:resourcetype><c:supported-calendar-component-set><c:comp name="'+l.component+'"/></c:supported-calendar-component-set>')).join(''))};
  const l=lists.get(req.url);assert(l,'unknown list');return{status:207,text:multi(response(req.url,'<d:resourcetype><d:collection/></d:resourcetype>')+[...l.objects].map(([url,o])=>response(url,'<d:getetag>'+xml(o.etag)+'</d:getetag><d:resourcetype/>')).join(''))};
 }
 if(req.method==='MKCALENDAR'){const doc=new DOMParser().parseFromString(body,'application/xml'),name=doc.getElementsByTagNameNS('DAV:','displayname')[0].textContent,component=doc.getElementsByTagNameNS('urn:ietf:params:xml:ns:caldav','comp')[0].getAttribute('name');lists.set(req.url,{name,component,objects:new Map()});return{status:201,text:''};}
 const list=[...lists].find(([url])=>req.url.startsWith(url))?.[1];assert(list,'unknown object');const existing=list.objects.get(req.url);assert(((req.headers['If-Match']||req.headers['if-match'])===existing?.etag)||!existing&&(req.headers['If-None-Match']||req.headers['if-none-match'])==='*','missing conditional write');
 if(req.method==='PUT'){const etag='"'+(++serial)+'"';list.objects.set(req.url,{etag,body});return{status:existing?204:201,text:'',headers:{etag}};}
 if(req.method==='DELETE'){list.objects.delete(req.url);return{status:204,text:''};}throw Error('Unexpected '+req.method);
};
const app={plugins:{enabledPlugins:new Set()},vault:{configDir:'.obsidian',getName:()=> 'Work',getMarkdownFiles:()=>[...notes.values()],getAbstractFileByPath:p=>notes.get(p),read:async f=>f.text,process:async(f,fn)=>{f.text=fn(f.text);f.stat={mtime:++serial,size:f.text.length};events.get('modify')?.(f)},on:(name,fn)=>events.set(name,fn),adapter:{exists:async()=>false,write:async()=>{},read:async()=>''}},workspace:{onLayoutReady:()=>{}}};
class Plugin{constructor(){this.app=app;this.manifest={dir:'.obsidian/plugins/abyss-notifications'}}async loadData(){return structuredClone(stored)}async saveData(s){stored=structuredClone(s)}addCommand(c){commands.set(c.id,c)}addSettingTab(t){tabs.push(t)}registerInterval(){}registerEvent(){}registerDomEvent(){}registerEditorExtension(){}}
class PluginSettingTab{constructor(app,p){this.app=app;this.plugin=p;this.containerEl=document.body.createEl('div',{cls:'settings'})}}

const module={exports:{}},require=name=>{if(name==='obsidian')return{Plugin,PluginSettingTab,Setting,Modal,Platform:{isMobileApp:location.hash.includes('phone'),isIosApp:location.hash.includes('phone')},Notice:class{constructor(s){notices.push(s)}},requestUrl:nativeRequest};if(name==='@codemirror/view')return{ViewPlugin:{fromClass:()=>({})}};throw Error('Unexpected native import '+name)};

(async()=>{let p;try{
 p=new module.exports();await p.onload();await commands.get('sync').callback();assert(p.result?.selected===3,'wrong task selection: '+p.phase);assert(lists.size===2,'wrong number of collections');const r=[...lists.values()].find(l=>l.component==='VTODO'),c=[...lists.values()].find(l=>l.component==='VEVENT');assert(r.name==='Work — Напоминания'&&c.name==='Work — Календарь','wrong collection names');assert(r.objects.size===2&&c.objects.size===1,'duplicated representations');assert([...c.objects.values()][0].body.includes('DTEND;TZID=Europe/Moscow:20261113T160000'),'duration endpoint wrong');assert([...c.objects.values()][0].body.includes('BEGIN:VALARM'),'event has no alert');assert([...c.objects.values()][0].body.includes('RRULE:FREQ=DAILY;COUNT=3'),'daily date span missing');
 const dateOnly=[...r.objects.values()].find(o=>o.body.includes('SUMMARY:Без времени'));assert(dateOnly&&dateOnly.body.includes('DUE;VALUE=DATE:20261115')&&!dateOnly.body.includes('VALARM'),'date-only reminder has wrong date or alarm');const noteText=mainNote.text,before=nativeCalls.filter(x=>x.method==='PUT').length;await p.sync(true);assert(nativeCalls.filter(x=>x.method==='PUT').length===before,'idle rewrites');assert(mainNote.text===noteText,'idle note changed');const phoneTask=[...r.objects.values()][0];phoneTask.body='Changed in Reminders';phoneTask.etag='"phone-edit"';await p.sync(true);assert([...r.objects.values()][0].body.includes('SUMMARY:Позвонить'),'source truth not restored');assert(mainNote.text===noteText,'reverse import happened');assert(!nativeCalls.some(x=>x.method==='REPORT'||x.method==='GET'),'reads task bodies');
 p.settings.delaySeconds=5;tabs[0].display();await new Promise(r=>setTimeout(r,50));for(const el of document.querySelectorAll('input,select,button,textarea')){const b=el.getBoundingClientRect();assert(b.right<=innerWidth+1&&b.left>=0,'UI overflow '+el.tagName);}assert(document.querySelector('input[type=password]'),'password unmasked');assert(document.querySelector('select').options.length===3,'device policy missing');document.body.dataset.result='PASS';
 }catch(e){document.body.dataset.result='FAIL: '+e.message;}finally{p?.onunload();}})();
